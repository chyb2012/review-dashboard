}

}

}

.timeline { position: relative; padding-left: 32px; }

  content: ''; position: absolute; left: 9px; top: 6px; bottom: 6px;

}

  display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 4px;
}

  display: flex; gap: 10px; align-items: center; margin-bottom: 14px; flex-wrap: wrap;
}

}
.filter-bar select:focus, .filter-bar input:focus { border-color: var(--accent); }

<body>

<div class="wrap">
  <div class="crumbs">
    <a href="./index.html">← 返回辅导项目看板</a>
    <span class="sep">·</span>
    <span id="crumb-name">项目详情</span>
  </div>

  <div id="hero" class="hero" style="display:none"></div>

  <div class="grid">
    <div class="card">
      <h2>项目基本情况</h2>
      <div id="info-grid" class="info-grid"></div>
    </div>
    <div class="card filing-card">
      <h2 style="text-align:left;margin-left:0;">辅导备案报告</h2>
      <div class="disclaimer" style="text-align:left;display:block;">
        以下公司基本情况（全称、成立日期、注册资本、统一社会信用代码、主营业务、控股股东等）均来源于
        <strong>辅导备案报告 PDF 原文</strong>。点击下方按钮在线查看或下载。
      </div>
      <div id="filing-box" style="margin-top:14px"></div>
    </div>
  </div>

  <div class="card" style="padding:22px">
    <h2>辅导期间提交的全部报告</h2>
    <div class="filter-bar">
      <select id="ft">
        <option value="">全部类型</option>
      </select>
      <input id="fq" type="search" placeholder="搜索报告标题…" autocomplete="off" style="flex:1 1 160px">
      <span class="count" id="rcount"></span>
    </div>
    <div id="timeline" class="timeline"></div>
  </div>

  <footer>
    数据来源：中国证监会资本市场电子化信息披露平台「辅导企业」栏目（60 页、1196 个项目）。
    抓取日期 2026-11-06。PDF 下载地址映射自网站内部路径
    <code>/mnt/storage/...</code> → <code>http://eid.csrc.gov.cn/mnt/storage/...</code>。
  </footer>
</div>

<script src="assets/details-data.js"></script>
<script>
(function() {
  var id = parseInt(new URLSearchParams(location.search).get('id') || '0', 10);
  var all = window.__IPO_DETAILS__ || [];
  var p = all.find(function(x) { return x.id === id; });
  if (!p) {
    document.querySelector('.wrap').innerHTML = '<div style="padding:60px 0;text-align:center;color:#6B7280">未找到项目，请确认链接中的 <code>id</code> 参数。</div>';
    return;
  }

  // hero
  document.getElementById('crumb-name').textContent = p.company;
  document.title = p.company + ' · IPO 辅导项目详情';
  var latest = p.reports[0];
  var filing = p.reports.find(function(r) { return r.type.indexOf('备案报告') >= 0; });
  var progress = p.reports.filter(function(r) { return r.type.indexOf('进展') >= 0; });
  var badges = [
    '<span class="badge live"><b>备案时间</b>' + p.filing + '</span>',
    '<span class="badge"><b>最新公告</b>' + p.latest_notice + '</span>',
    '<span class="badge"><b>累计报告</b>' + p.reports.length + ' 份</span>'
  ];
  if (p.period_no != null) badges.push('<span class="badge"><b>进展报告</b>第 ' + p.period_no + ' 期</span>');

  document.getElementById('hero').innerHTML =
    '<h1>' + p.company + '</h1>' +
    '<p class="sub">' + p.agency + ' · ' + p.region + ' · 当前状态：' + p.status + '</p>' +
    '<div class="badges">' + badges.join('') + '</div>';
  document.getElementById('hero').style.display = '';

  // info grid
  var statusClass = ({
    '辅导备案':'ongoing','辅导工作完成':'done','辅导验收':'check',
    '撤回辅导备案':'withdraw','辅导验收终止':'stop'
  })[p.status] || 'ongoing';
  var rows = [
    ['辅导对象', p.company],
    ['辅导机构', p.agency],
    ['派出机构', p.region],
    ['备案时间', p.filing],
    ['当前状态', '<span class="tag ' + statusClass + '">' + p.status + '</span>'],
    ['最新公告日期', p.latest_notice],
    ['最新报告类型', p.latest_type],
    ['进展报告期号', p.period_no != null ? '第 ' + p.period_no + ' 期' : '—'],
    ['平台公示进展报告数', p.progress_count + ' 份'],
  ];
  document.getElementById('info-grid').innerHTML =
    rows.map(function(r) { return '<div class="label">' + r[0] + '</div><div class="val">' + r[1] + '</div>'; }).join('');

  // filing PDF
  var fb = document.getElementById('filing-box');
  if (p.filing_report_pdf) {
    fb.innerHTML =
      '<div class="title">' + p.filing_report_title + '</div>' +
      '<div class="date">公告日期：' + p.filing_report_notice + '</div>' +
      '<a class="btn-pdf" href="' + p.filing_report_pdf + '" target="_blank" rel="noopener"><span class="icon">📄</span>在线查看 / 下载 PDF</a>' +
      '<br>' +
      '<a class="btn-ghost" href="' + p.filing_report_pdf + '" target="_blank" rel="noopener">在新标签页打开</a>';
  } else {
    fb.innerHTML = '<div class="no-pdf">该项目未上传辅导备案报告 PDF，可联系派出机构或辅导机构获取。</div>';
  }

  // timeline
  var tl = document.getElementById('timeline');
  var typeMap = {'辅导备案报告':'filing','辅导进展情况报告':'progress','辅导工作完成报告':'done','辅导验收报告':'accept'};
  var allReports = p.reports;

  function render(filterType, kw) {
    kw = (kw || '').trim().toLowerCase();
    var list = allReports.filter(function(r) {
      if (filterType && r.type !== filterType) return false;
      if (kw && r.title.toLowerCase().indexOf(kw) < 0) return false;
      return true;
    });
    var html = '';
    list.forEach(function(r, i) {
      var dotCls = i === 0 ? 'latest' : '';
      var tCls = typeMap[r.type] || 'progress';
      var titleHtml = r.title;
      // 高亮期号
      titleHtml = titleHtml.replace(/(第[零一二三四五六七八九十百\d]+期)/g, '<span class="period">$1</span>');
      html +=
        '<div class="tl-item">' +
        '<div class="tl-dot ' + dotCls + '"></div>' +
        '<div class="tl-head">' +
        '<span class="tl-date">' + r.notice + '</span>' +
        '<span class="tl-type ' + tCls + '">' + r.type + '</span>' +
        (i === 0 ? '<span class="tl-type filing">最新</span>' : '') +
        '</div>' +
        '<div class="tl-title">' + titleHtml + '</div>' +
        '<div class="tl-actions">' +
        (r.pdf ? '<a href="' + r.pdf + '" target="_blank" rel="noopener">📄 查看 PDF</a>' : '') +
        '</div>' +
        '</div>';
    });
    if (!html) html = '<div style="padding:30px 0;text-align:center;color:#6B7280">没有符合筛选条件的报告</div>';
    tl.innerHTML = html;
    document.getElementById('rcount').textContent = '共 ' + list.length + ' 份（平台公示）';
  }

  // 填充筛选下拉
  var allTypes = [];
  allReports.forEach(function(r) { if (allTypes.indexOf(r.type) < 0) allTypes.push(r.type); });
  var fsel = document.getElementById('ft');
  allTypes.forEach(function(t) {
    var o = document.createElement('option'); o.value = t; o.textContent = t; fsel.appendChild(o);
  });

  render('', '');
  fsel.addEventListener('change', function() { render(fsel.value, document.getElementById('fq').value); });
  var qbox = document.getElementById('fq');
  var t;
  qbox.addEventListener('input', function() {
    clearTimeout(t);
    t = setTimeout(function() { render(fsel.value, qbox.value); }, 150);
  });
})();
</script>
</body>
</html>
