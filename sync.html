<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>数据更新日志 · 发行上市审核动态</title>
<style>
  :root { --ink:#0f172a; --muted:#64748b; --line:#e2e8f0; --bg:#f6f8fb; --ok:#15803d; --bad:#b91c1c; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
  .wrap { max-width:1040px; margin:0 auto; padding:28px 20px 60px; }
  header { display:flex; justify-content:space-between; align-items:flex-end; gap:16px; margin-bottom:22px; flex-wrap:wrap; }
  h1 { margin:0 0 6px; font-size:24px; letter-spacing:.5px; }
  .sub { color:var(--muted); font-size:13px; }
  .back { text-decoration:none; color:#334155; border:1px solid #cbd5e1; background:#fff; border-radius:8px; padding:7px 12px; font-size:13px; }
  .summary { display:flex; gap:12px; flex-wrap:wrap; margin-bottom:18px; }
  .kpi { background:#fff; border:1px solid var(--line); border-radius:12px; padding:12px 16px; min-width:150px; }
  .kpi .l { font-size:12px; color:var(--muted); margin-bottom:4px; }
  .kpi .v { font-size:18px; font-weight:700; }
  .batch { background:#fff; border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin-bottom:14px; }
  .batch-head { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:10px; flex-wrap:wrap; }
  .batch-time { font-weight:700; font-size:15px; }
  .badge { font-size:12px; padding:2px 9px; border-radius:999px; border:1px solid; }
  .badge.ok { color:var(--ok); border-color:#bbf7d0; background:#f0fdf4; }
  .badge.bad { color:var(--bad); border-color:#fecaca; background:#fef2f2; }
  .rows { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:8px; }
  .src { border:1px solid var(--line); border-radius:10px; padding:8px 10px; font-size:13px; }
  .src b { display:block; font-size:13px; margin-bottom:3px; }
  .src .m { color:var(--muted); font-size:12px; }
  .empty { color:var(--muted); padding:40px; text-align:center; background:#fff; border:1px dashed var(--line); border-radius:12px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>数据更新日志</h1>
      <div class="sub">记录每次同步的时间、数据源状态与更新条数</div>
    </div>
    <a class="back" href="./index.html">← 返回看板</a>
  </header>
  <div class="summary" id="summary"></div>
  <div id="list"><div class="empty">正在加载…</div></div>
</div>
<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const esc = (v) => String(v == null ? '' : v).replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  const NAME = { sse:'上交所', szse:'深交所', bse:'北交所', neeq:'股转系统', ipo_issue:'发行上市' };
  const ORDER = ['sse','szse','bse','neeq','ipo_issue'];

  async function load() {
    let data = null;
    try {
      const r = await fetch('data/sync_log.json', { cache: 'no-store' });
      if (r.ok) data = await r.json();
    } catch (e) {}
    if (!data) {
      try {
        const r = await fetch('/api/sync/log', { cache: 'no-store' });
        if (r.ok) { const j = await r.json(); data = { runs: j.data || [] }; }
      } catch (e) {}
    }
    render((data && data.runs) || []);
  }

  function seconds(a, b) {
    const t1 = Date.parse((a || '').replace(' ', 'T'));
    const t2 = Date.parse((b || '').replace(' ', 'T'));
    if (!t1 || !t2 || t2 < t1) return 0;
    return Math.round((t2 - t1) / 1000);
  }

  function group(runs) {
    const out = [];
    let cur = null;
    for (const r of runs) {
      if (!cur || cur.seen.has(r.source)) {
        cur = { items: [], seen: new Set() };
        out.push(cur);
      }
      cur.items.push(r); cur.seen.add(r.source);
    }
    return out;
  }

  function render(runs) {
    if (!runs.length) {
      $('#list').innerHTML = '<div class="empty">暂无同步记录</div>';
      return;
    }
    const batches = group(runs);
    const last = batches[0].items;
    const lastTime = last.map((x) => x.finished_at).filter(Boolean).sort().pop() || '—';
    $('#summary').innerHTML = `
      <div class="kpi"><div class="l">最近一次同步</div><div class="v">${esc(lastTime)}</div></div>
      <div class="kpi"><div class="l">同步批次</div><div class="v">${batches.length}</div></div>
      <div class="kpi"><div class="l">数据源</div><div class="v">${new Set(runs.map((x) => x.source)).size} 个</div></div>`;

    $('#list').innerHTML = batches.map((b) => {
      const end = b.items.map((x) => x.finished_at).filter(Boolean).sort().pop() || '—';
      const start = b.items.map((x) => x.started_at).filter(Boolean).sort()[0] || '';
      const okAll = b.items.every((x) => Number(x.ok) === 1);
      const total = b.items.reduce((s, x) => s + (Number(x.records) || 0), 0);
      const cost = seconds(start, end);
      const badge = okAll ? '<span class="badge ok">全部成功</span>' : '<span class="badge bad">存在失败</span>';
      const items = ORDER.filter((s) => b.items.some((x) => x.source === s)).map((s) => {
        const x = b.items.filter((y) => y.source === s).pop();
        const ok = Number(x.ok) === 1;
        return `<div class="src"><b>${NAME[s] || s} <span class="badge ${ok ? 'ok' : 'bad'}">${ok ? '成功' : '失败'}</span></b>
          <span class="m">更新 ${Number(x.records) || 0} 条 · 耗时 ${seconds(x.started_at, x.finished_at)}s</span>
          <span class="m">${esc(x.message || '')}</span></div>`;
      }).join('');
      return `<div class="batch">
        <div class="batch-head"><span class="batch-time">${esc(end)}</span>
        <span class="m" style="color:#64748b;font-size:12px">合计更新 ${total} 条 · 总耗时 ${cost}s</span>${badge}</div>
        <div class="rows">${items}</div></div>`;
    }).join('');
  }

  load();
})();
</script>
</body>
</html>
